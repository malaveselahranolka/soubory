[workspace]
members = ["crates/*"]
exclude = ["spikes"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Imaging", "Win32_Security", "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_System_Com",
  "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_LibraryLoader",
  "Win32_System_Ole", "Win32_System_Registry", "Win32_System_SystemInformation",
  "Win32_System_SystemServices", "Win32_System_Console", "Win32_System_Threading", "Win32_System_IO",
  "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_Controls",
  "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"
rayon = "1.12"
memchr = "2.8"
unicode-normalization = "0.1.26"
fm-fs = { path = "crates/fm-fs" }
fm-index = { path = "crates/fm-index" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
