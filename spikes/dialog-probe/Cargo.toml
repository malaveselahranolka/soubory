# Spike for M1: how to read a file dialog's current folder (out-of-process vs in-process hook).
[workspace]
members = ["probe", "hook"]
resolver = "3"

[workspace.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common",
  "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_LibraryLoader",
  "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Ole", "Win32_Graphics_Gdi",
] }
